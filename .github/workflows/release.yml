name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to publish, e.g. 0.1.20. Leave blank to publish a dev prerelease."
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      # Provenance: proves an artifact came from this repo's workflow.
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          workspaces: .
          shared-key: sink

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Bound each attempt and retry, so a transient mirror outage costs
          # minutes instead of hanging apt for the job's full timeout.
          apt_try() {
            sudo timeout 300 apt-get update &&
              sudo timeout 600 apt-get install -y -o Acquire::Retries=3 \
              libwebkit2gtk-4.1-dev \
              build-essential \
              curl \
              wget \
              file \
              libxdo-dev \
              libssl-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libpipewire-0.3-dev \
              clang \
              squashfs-tools \
              zstd \
              jq
          }
          apt_try || { sleep 30; apt_try; } || { sleep 120; apt_try; }

      - name: Determine release
        # A version input (manual dispatch) cuts a stable vX.Y.Z; every other
        # push refreshes the rolling `dev` prerelease.
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          input="$INPUT_VERSION"
          if [ -n "$input" ]; then
            # Validate rather than trust the input: unchecked it yields bad
            # tags, and a feature-branch dispatch would tag unreviewed code.
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::stable releases must be dispatched from main (got $GITHUB_REF)"
              exit 1
            fi
            if [[ ! "$input" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must be X.Y.Z (got '$input')"
              exit 1
            fi
            if git rev-parse "v$input" >/dev/null 2>&1; then
              echo "::error::tag v$input already exists"
              exit 1
            fi
            # A lower number would still tag and become "Latest".
            latest=$(git tag -l 'v*' --sort=-v:refname | head -1); latest=${latest#v}
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$input" | sort -V | tail -1)" != "$input" ]; then
              echo "::error::version $input is not above the latest tag v$latest"
              exit 1
            fi
            ver="$input"; tag="v$ver"; pre=false
          else
            latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
            latest=${latest#v}; latest=${latest:-0.0.0}
            IFS=. read -r ma mi pa <<< "$latest"
            ver="$ma.$mi.$((pa + 1))"; tag="dev"; pre=true
          fi
          {
            echo "version=$ver"
            echo "tag=$tag"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $tag (version $ver, prerelease=$pre)"

      - name: Stamp version into the build
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.version }}"
          jq --arg v "$ver" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          npm pkg set version="$ver"
          # Keep the crate version in step so CARGO_PKG_VERSION (crash reports,
          # --version, package metadata) matches the release instead of 0.1.0.
          sed -i '0,/^version = /{s/^version = .*/version = "'"$ver"'"/}' src-tauri/Cargo.toml

      - run: npm ci

      - name: Verify (never publish untested code)
        run: |
          npm run build
          npm test
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build bundles
        run: npm run tauri build

      - name: Repack AppImage against system PipeWire
        # Strip the bundled libpipewire so the loader uses the system one.
        run: |
          set -euo pipefail
          cd "$(dirname "$(find target -path '*/release/bundle/appimage/sink_*.AppImage' | head -1)")"
          app=$(ls sink_*.AppImage)
          ./"$app" --appimage-extract > /dev/null
          rm -fv squashfs-root/usr/lib/libpipewire-0.3.so*
          offset=$(./"$app" --appimage-offset)
          head -c "$offset" "$app" > runtime
          mksquashfs squashfs-root payload.squashfs -root-owned -noappend -quiet -comp zstd
          cat runtime payload.squashfs > "$app"
          chmod +x "$app"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release/bundle/appimage/sink_*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          if [ "${{ steps.ver.outputs.prerelease }}" = "true" ]; then
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" --target "$GITHUB_SHA" --title "Dev build" --prerelease \
              --notes "Rolling development build from the latest commit on main. Not a stable release - expect rough edges."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "WaveSink $tag" \
              --generate-notes --notes "Linux builds:
          - **AppImage** - portable, run anywhere (\`chmod +x\` and go)
          - **.deb** - Debian / Ubuntu and derivatives
          - **.rpm** - Fedora / openSUSE and derivatives
          - **.pkg.tar.zst** - Arch (\`sudo pacman -U\`)

          Requires PipeWire with \`pipewire-pulse\` and WirePlumber 0.5+.

          Every file above is checksummed in \`SHA256SUMS\` and carries a build
          provenance attestation, so you can check where it came from:
          \`\`\`
          gh attestation verify sink_${{ steps.ver.outputs.version }}_amd64.deb --owner calmasacow
          \`\`\`"
          fi
          # Checksums by basename so users can verify downloads; the archpkg job
          # appends its own line.
          ( cd target/release/bundle
            sha256sum appimage/sink_*.AppImage deb/*.deb rpm/*.rpm \
              | awk '{ n=$2; sub(/.*\//, "", n); print $1"  "n }' \
              > "$GITHUB_WORKSPACE/SHA256SUMS" )
          gh release upload "$tag" --clobber \
            "$GITHUB_WORKSPACE/SHA256SUMS" \
            target/release/bundle/appimage/sink_*.AppImage \
            target/release/bundle/deb/*.deb \
            target/release/bundle/rpm/*.rpm

  archpkg:
    name: Arch package
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    container: archlinux:latest
    steps:
      - name: Install build tooling
        run: pacman -Syu --noconfirm --needed base-devel git github-cli

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and attach sink-bin
        id: pkg
        env:
          VER: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          useradd -m builder
          install -d -o builder /build
          deb="sink_${VER}_amd64.deb"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$deb" --dir /build
          sum=$(sha256sum "/build/$deb" | cut -d' ' -f1)
          cp packaging/arch/PKGBUILD /build/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VER}/; s/^sha256sums=.*/sha256sums=('${sum}')/" /build/PKGBUILD
          chown -R builder:builder /build
          sudo -u builder bash -lc 'cd /build && makepkg --noconfirm --nodeps'
          pkg=$(ls /build/sink-bin-*-x86_64.pkg.tar.zst)
          # Same gate the pull-request install tests use: nothing publishes
          # unless the packaged binary launches and stays up.
          pacman -U --noconfirm "$pkg" >/dev/null
          pacman -S --noconfirm --needed xorg-server-xvfb mesa >/dev/null
          packaging/smoke-test.sh
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$pkg"
          # The download must succeed: with --clobber below, a missing file
          # would replace the manifest with just this one line.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir /tmp
          if [ "$(wc -l < /tmp/SHA256SUMS)" -lt 3 ]; then
            echo "::error::downloaded SHA256SUMS has fewer than 3 entries; refusing to republish it"
            exit 1
          fi
          echo "$(sha256sum "$pkg" | cut -d' ' -f1)  $(basename "$pkg")" >> /tmp/SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber /tmp/SHA256SUMS
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pkg.outputs.pkg }}
